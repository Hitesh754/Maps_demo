services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-meridian}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-meridian}"]
      interval: 3s
      timeout: 3s
      retries: 10

  nats:
    image: nats:alpine
    container_name: meridian-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/varz"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: meridian-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: meridian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-meridian-media};
      mc anonymous set none local/$${S3_BUCKET:-meridian-media};
      exit 0;
      "

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile.migrate
    container_name: meridian-migrate
    environment:
      DATABASE_URL: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-meridian}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: meridian-api
    restart: unless-stopped
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-meridian}?sslmode=disable
      NATS_URL: nats://nats:4222
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-meridian-media}
      S3_FORCE_PATH_STYLE: "true"
      ENV: development
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10

  tile-server:
    image: protomaps/go-pmtiles:latest
    container_name: meridian-tile-server
    restart: unless-stopped
    profiles: ["tiles"]
    command: ["serve", "/tiles", "--interface=0.0.0.0", "--port=8080", "--cors=*", "--public-url=http://127.0.0.1:8082"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ../../data/tiles:/tiles:ro
    healthcheck:
      test: ["CMD", "/go-pmtiles", "show", "/tiles/vadodara.pmtiles"]
      interval: 3s
      timeout: 3s
      retries: 5

  map-assets:
    image: nginx:alpine
    container_name: meridian-map-assets
    restart: unless-stopped
    profiles: ["tiles"]
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ../../assets/map:/usr/share/nginx/html:ro
      - ./nginx-map-assets.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/glyphs/Noto%20Sans%20Regular/0-255.pbf"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  nats_data:
  minio_data:
